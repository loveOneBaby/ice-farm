<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145278"><title>冰原家园 · 冰原航图 · R14</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./styles.css">
</head>
<body><main class="board"><section class="game" id="game" aria-label="冰原家园，插画地图与农场经营">
<canvas id="scene" tabindex="0" aria-label="冰原地图，可拖动缩放，点击作物收获；下方导航提供全部经营功能"></canvas>
<button class="art-control crest-control" data-action="module-hub" aria-label="冰原家园，打开功能与存档菜单"></button>
<button class="art-control compass-control" data-action="map" aria-label="罗盘，打开区域导航与全岛视图"></button>
<button class="art-control expand-control" data-action="expand" aria-label="开拓冰原，选择扩建类型"></button>
<nav class="bottom-nav" aria-label="农场主导航"><button data-action="cartographer-home" aria-label="家园"><span>家园</span></button><button data-action="plant" aria-label="种植"><span>种植</span></button><button data-action="expand" aria-label="探索冰原"><span>探索</span></button><button data-action="bag" aria-label="仓库"><span>仓库</span></button></nav>
<div class="placement-bar" id="placementBar" hidden><span id="placementText"></span><button class="btn gold" data-action="confirm-place">在此建造</button><button class="btn subtle" data-action="cancel-place">取消</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="event-flashes" id="eventFlashes" aria-hidden="true"></div>
<div class="loading" id="loading"><img data-art="nav-build" alt=""><b>正在点亮冰原家园</b><span>载入插画与动画素材…</span></div>
<div class="modal-backdrop" id="modal" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-top"><div><small id="sheetEyebrow">ICE HOMESTEAD · CARTOGRAPHER</small><h2 id="sheetTitle"></h2></div><button class="close-btn" data-action="close" aria-label="关闭面板">关闭</button></div><div id="sheetBody"></div></section></div>
<div id="saveWarning" class="screen-reader" role="status" aria-live="polite"></div><div class="legacy-ui" aria-hidden="true"><div id="weatherLayer"></div><span id="coinCount"></span><span id="gemCount"></span><span id="levelLabel"></span><span id="weatherPill"></span><span id="missionTitle"></span><span id="missionProgress"></span><span id="islandSummary"></span><span id="regionTotal"></span><div id="districtList"></div><div id="moduleDock"></div><span id="worldTip"></span><span id="saveBadge"></span><span id="saveLabel"></span><div id="features"></div><canvas id="minimap" width="190" height="115"></canvas></div>
</section></main><input id="importInput" type="file" accept="application/json,.json" hidden>
<script src="./assets.js"></script><script src="./art-meta.js"></script><script src="./scenery.js"></script><script src="./crop-art.js"></script><script src="./config.js"></script><script src="./label-art.js"></script>
<script src="./weather.js"></script>
<script src="./app.js"></script>
</body></html>
